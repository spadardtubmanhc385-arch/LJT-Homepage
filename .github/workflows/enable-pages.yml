name: Temporary enable Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          gh api "repos/${GITHUB_REPOSITORY}/pages" || true
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f 'build_type=workflow'
          gh api "repos/${GITHUB_REPOSITORY}/pages"