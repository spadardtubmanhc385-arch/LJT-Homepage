name: Temporary enable Pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build and verify
        run: |
          npm install -g uglify-js
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
          {
            bundle exec jekyll build --baseurl "/LJT-Homepage"
            echo "=== BUILD EXIT: $? ==="
            echo "=== SITE PAGES ==="
            find _site -name '*.html' | sort
            echo "=== ABOUT CHECKS ==="
            for term in "Junteng Liu" "HKUST NLP Group" "Junxian He" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Zhiyuan Honor Scholarship" "SynLogic" "Perception Bottleneck" "Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient" "jliugi@connect.ust.hk" "Vicent0205" "junteng88716710"; do
              if grep -q "$term" _site/index.html; then echo "PASS: $term"; else echo "FAIL: $term"; fi
            done
            echo "=== PUBLICATIONS CHECKS ==="
            for term in "SynLogic" "Perception Bottleneck" "Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient"; do
              if grep -q "$term" _site/publications/index.html; then echo "PASS: $term"; else echo "FAIL: $term"; fi
            done
            echo "=== CV CHECKS ==="
            for term in "SynLogic" "Perception Bottleneck" "Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient" "Skills"; do
              if grep -q "$term" _site/cv/index.html; then echo "PASS: $term"; else echo "FAIL: $term"; fi
            done
          } > pages-diagnosis.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-diagnosis.txt
          git commit -m "Record Jekyll build verification"
          git push origin HEAD:master
