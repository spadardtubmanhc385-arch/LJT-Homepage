name: Temporary demo content cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove demo content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet --ignore-unmatch _posts _talks _teaching _portfolio _drafts files _data/comments
          git rm --quiet --ignore-unmatch \
            _publications/2009-10-01-paper-title-number-1.md \
            _publications/2010-10-01-paper-title-number-2.md \
            _publications/2015-10-01-paper-title-number-3.md \
            _publications/2024-02-17-paper-title-number-4.md \
            _publications/2025-06-08-paper-title-number-5.md
          git rm --quiet --ignore-unmatch \
            _pages/archive-layout-with-content.md \
            _pages/category-archive.html \
            _pages/collection-archive.html \
            _pages/markdown.md \
            _pages/page-archive.html \
            _pages/portfolio.html \
            _pages/sitemap.md \
            _pages/tag-archive.html \
            _pages/talkmap.html \
            _pages/talks.html \
            _pages/teaching.html \
            _pages/terms.md \
            _pages/year-archive.html
          git rm --quiet --ignore-unmatch .github/workflows/cleanup.yml
          git commit -m "Remove template demo content and pages"
          git push origin HEAD:master