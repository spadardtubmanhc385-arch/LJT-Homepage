name: Temporary finalize and publish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clean temporary and irrelevant files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --quiet --ignore-unmatch \
            pages-diagnosis.txt \
            .github/workflows/enable-pages.yml \
            .github/workflows/bad-pr.yml \
            .github/workflows/close-llm-run.yml \
            .github/workflows/lock-closed-cron.yml \
            .github/workflows/scrape_talks.yml \
            .github/workflows/finalize.yml
          git commit -m "Remove temporary diagnostics and upstream maintenance workflows"
          git push origin HEAD:master
      - name: Build site
        run: |
          sudo npm install -g uglify-js
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
          bundle exec jekyll build --baseurl "/LJT-Homepage"
          cp -r _site /tmp/built-site
      - name: Publish to gh-pages branch
        run: |
          git checkout --orphan gh-pages
          git rm -rf . --quiet
          cp -r /tmp/built-site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish personal homepage"
          git push origin gh-pages
